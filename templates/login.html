<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: auto; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #login-box { width: 320px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; }
  #login-box h1 { font-size: 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  #login-box .form-group { margin-bottom: 12px; }
  #login-error { color: var(--red); font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  #login-submit { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 8px; font-family: var(--font); font-size: 13px; cursor: pointer; margin-top: 4px; }
  #login-submit:disabled { opacity: .6; cursor: default; }
  .form-check { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
  <div id="login-box">
    <h1>✉ Correo</h1>
    <form id="login-form" autocomplete="on">
      <div id="login-error"></div>
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input class="form-input" id="login-user" name="user" type="text" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-group form-check">
        <input type="checkbox" id="login-remember" checked>
        <label for="login-remember">Manter conectado</label>
      </div>
      <button id="login-submit" type="submit">Entrar</button>
    </form>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  const err = document.getElementById('login-error');
  err.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user:     document.getElementById('login-user').value,
        password: document.getElementById('login-password').value,
        remember: document.getElementById('login-remember').checked,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/';
    } else {
      err.textContent = data.error || 'Erro ao entrar';
    }
  } catch (e) {
    err.textContent = 'Erro de conexão';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
