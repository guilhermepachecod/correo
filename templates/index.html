<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#0f0f10;
--bg2:#17171a;
--bg3:#1e1e22;
--bg4:#26262c;
--line:rgba(255,255,255,.07);
--text:#e8e8ea;
--muted:#7c7c84;
--accent:#6c8cff;
--green:#10b981;
--red:#ef4444;
--amber:#f59e0b;
--radius:10px;
--font:'DM Sans',sans-serif;
--mono:'DM Mono',monospace;
--sidebar-w:230px;
--list-w:360px;
--h-split:48%;
}

[data-theme="light"]{
--bg:#f3f3f6;
--bg2:#ffffff;
--bg3:#f2f2f5;
--bg4:#e9e9ee;
--line:rgba(0,0,0,.08);
--text:#151518;
--muted:#666;
--accent:#4f6ef7;
}

html,body{
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:var(--font);
font-size:14px;
}

#app{
height:100vh;
display:grid;
grid-template-columns:var(--sidebar-w) var(--list-w) 1fr;
}

#app[data-layout="horizontal"]{
grid-template-columns:var(--sidebar-w) 1fr;
}

#app[data-layout="horizontal"] #reading-pane{
display:none;
}

#app[data-layout="horizontal"] #email-list-panel{
display:grid;
grid-template-rows:auto auto auto minmax(120px,var(--h-split)) 6px minmax(120px,1fr);
min-height:0;
}

#app[data-layout="horizontal"] #reading-pane-inline{
display:flex;
}

#splitter{
display:none;
background:var(--line);
cursor:row-resize;
}

#app[data-layout="horizontal"] #splitter{
display:block;
}

#sidebar{
background:var(--bg2);
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
overflow:hidden;
}

#sidebar-header{
padding:18px;
border-bottom:1px solid var(--line);
}

.logo{
font-size:20px;
font-weight:600;
}

.logo span{color:var(--accent)}

#compose-btn{
margin:12px;
padding:10px 14px;
border:none;
border-radius:var(--radius);
background:var(--accent);
color:#fff;
cursor:pointer;
}

#account-select{
margin:0 12px 10px;
padding:8px;
border-radius:8px;
border:1px solid var(--line);
background:var(--bg3);
color:var(--text);
}

#folders{
flex:1;
overflow:auto;
padding:8px;
}

#sidebar-footer{
padding:10px;
border-top:1px solid var(--line);
display:flex;
flex-direction:column;
gap:8px;
}

.sidebar-setting{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.sidebar-setting-btn,.autosync-select{
padding:5px 8px;
border-radius:7px;
border:1px solid var(--line);
background:var(--bg3);
color:var(--text);
cursor:pointer;
}

#email-list-panel{
background:var(--bg2);
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
min-height:0;
overflow:hidden;
}

#list-header,#list-actions,#bulk-bar{
padding:10px 14px;
border-bottom:1px solid var(--line);
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
}

#search-input{
width:100%;
padding:8px 10px;
border-radius:8px;
border:1px solid var(--line);
background:var(--bg3);
color:var(--text);
}

#search-wrap{flex:1}

.la-btn,.bulk-btn,#sync-btn,.ev-action-btn{
padding:6px 10px;
border-radius:7px;
border:1px solid var(--line);
background:transparent;
color:var(--text);
cursor:pointer;
}

#email-list{
overflow:auto;
min-height:0;
}

.email-item{
padding:12px 14px;
border-bottom:1px solid var(--line);
cursor:pointer;
}

.email-item:hover{
background:var(--bg3);
}

#reading-pane,#reading-pane-inline{
background:var(--bg);
display:flex;
flex-direction:column;
min-height:0;
overflow:hidden;
}

#reading-pane-inline{
display:none;
}

.ev-empty{
display:flex;
flex:1;
align-items:center;
justify-content:center;
color:var(--muted);
}

.ev-view{
display:flex;
flex-direction:column;
height:100%;
min-height:0;
}

.ev-header{
padding:14px;
border-bottom:1px solid var(--line);
display:flex;
flex-direction:column;
gap:10px;
}

.ev-subject{
font-size:18px;
font-weight:600;
}

.ev-body{
flex:1;
overflow:auto;
padding:16px;
}

.ev-body-html{
background:var(--bg2);
padding:16px;
border-radius:10px;
}

.ev-body-text{
white-space:pre-wrap;
font-family:var(--mono);
}

#compose-modal,#account-modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:100;
align-items:center;
justify-content:center;
}

#compose-box,#account-box{
width:700px;
max-width:95vw;
max-height:90vh;
overflow:auto;
background:var(--bg2);
border-radius:12px;
padding:20px;
}

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:10px 16px;
border-radius:10px;
background:var(--bg3);
border:1px solid var(--line);
display:none;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:20px}
</style>
</head>

<body>

<div id="app" data-layout="vertical">

<!-- SIDEBAR -->
<div id="sidebar">

<div id="sidebar-header">
<div class="logo">cor<span>reo</span></div>
</div>

<button id="compose-btn" onclick="openCompose()">✏️ Escrever</button>

<select id="account-select" onchange="onAccountChange()">
<option value="">Todas as contas</option>
</select>

<div id="folders"></div>

<div id="sidebar-footer">

<div class="sidebar-setting">
<span>Tema</span>
<button id="toggle-theme" class="sidebar-setting-btn" onclick="toggleTheme()">☀ Claro</button>
</div>

<div class="sidebar-setting">
<span>Layout</span>
<button id="toggle-layout" class="sidebar-setting-btn" onclick="toggleLayout()">⇔ Horizontal</button>
</div>

<div class="sidebar-setting">
<span>Auto-sync</span>
<select id="autosync-select" class="autosync-select" onchange="setAutoSync(this.value)">
<option value="0">Off</option>
<option value="5">5 min</option>
<option value="10">10 min</option>
<option value="15">15 min</option>
<option value="30">30 min</option>
<option value="60">1 hora</option>
</select>
</div>

<div class="sidebar-setting">
<span>Imagens</span>
<button class="sidebar-setting-btn" onclick="toggleEmailImages()">ON/OFF</button>
</div>

<div class="sidebar-setting">
<span>Modo</span>
<button class="sidebar-setting-btn" onclick="setEmailViewMode('html')">HTML</button>
<button class="sidebar-setting-btn" onclick="setEmailViewMode('text')">Texto</button>
</div>

</div>
</div>

<!-- LIST -->
<div id="email-list-panel">

<div id="list-header">
<div id="search-wrap">
<input id="search-input" placeholder="Buscar..." oninput="debounceSearch()">
</div>
<button id="sync-btn" onclick="syncCurrent()">↻</button>
</div>

<div id="list-actions">
<button class="la-btn" onclick="selectAll()">☑ Todos</button>
<button class="la-btn" onclick="deselectAll()">☐ Nenhum</button>
<button class="la-btn" onclick="bulkActionAll('mark_read')">✓ Ler todos</button>
<button class="la-btn" onclick="bulkActionAll('delete')">🗑 Apagar todos</button>
</div>

<div id="bulk-bar">
<span id="bulk-count"></span>
<button class="bulk-btn" onclick="bulkAction('delete')">Excluir</button>
</div>

<div id="email-list"></div>

<div id="splitter"></div>

<!-- HORIZONTAL READER -->
<div id="reading-pane-inline">
<div id="reading-empty-inline" class="ev-empty">Selecione um e-mail</div>

<div id="email-view-inline" class="ev-view">
<div class="ev-header">
<div id="ev-subject-inline" class="ev-subject"></div>

<div>
<button class="ev-action-btn" onclick="deleteEmail()">🗑 Excluir</button>
<button class="ev-action-btn" onclick="toggleEmailImages()">🖼</button>
<button class="ev-action-btn" onclick="setEmailViewMode('html')">HTML</button>
<button class="ev-action-btn" onclick="setEmailViewMode('text')">TXT</button>
</div>
</div>

<div class="ev-body">
<div id="ev-body-html-inline" class="ev-body-html"></div>
<pre id="ev-body-text-inline" class="ev-body-text"></pre>
</div>
</div>
</div>

</div>

<!-- RIGHT READER -->
<div id="reading-pane">

<div id="reading-empty" class="ev-empty">
Selecione um e-mail para ler
</div>

<div id="email-view" class="ev-view">

<div class="ev-header">
<div id="ev-subject" class="ev-subject"></div>

<div>
<button class="ev-action-btn" onclick="deleteEmail()">🗑 Excluir</button>
<button class="ev-action-btn" onclick="toggleEmailImages()">🖼</button>
<button class="ev-action-btn" onclick="setEmailViewMode('html')">HTML</button>
<button class="ev-action-btn" onclick="setEmailViewMode('text')">TXT</button>
</div>
</div>

<div class="ev-body">
<div id="ev-body-html" class="ev-body-html"></div>
<pre id="ev-body-text" class="ev-body-text"></pre>
</div>

</div>
</div>

</div>

<!-- COMPOSE -->
<div id="compose-modal">
<div id="compose-box">
Nova mensagem
</div>
</div>

<!-- ACCOUNT -->
<div id="account-modal">
<div id="account-box">
Gerenciar contas
</div>
</div>

<div id="toast"></div>

<script src="/static/app.js"></script>

</body>
</html>
